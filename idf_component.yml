description: PocketJS runtime and RGB565 framebuffer manager for ESP32-P4
url: https://github.com/HalfSweet/PocketJS-IDF
repository: https://github.com/HalfSweet/PocketJS-IDF.git
issues: https://github.com/HalfSweet/PocketJS-IDF/issues
documentation: https://github.com/HalfSweet/PocketJS-IDF/blob/main/API.md
changelog: https://github.com/HalfSweet/PocketJS-IDF/releases
license: MIT
tags:
  - pocketjs
  - javascript
  - quickjs
  - display
  - esp32p4
targets:
  - esp32p4
  - esp32s31
dependencies:
  idf: ">=5.4"
  espressif/quickjs-ng: "0.14.0"
files:
  use_gitignore: true
  exclude:
    - ".clang-format"
    - ".gitmodules"
    - ".git/**/*"
    - "**/.git"
    - "**/.git/**/*"
    - "**/.github/**/*"
    - ".ci/**/*"
    - "cliff.toml"
    - "tests/test_component_archive.py"
    - "tools/audit_component_archive.py"
    - "**/AGENTS.md"
    - "**/build*/**/*"
    - "**/managed_components/**/*"
    - "**/dependencies.lock"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/node_modules/**/*"
    - "**/target/**/*"
    - "**/dist/**/*"
    - "**/.cache/**/*"
    - "tests/output/**/*"
    - "vendor/pocketjs/.gitignore"
    - "vendor/pocketjs/CLAUDE.md"
    - "vendor/pocketjs/README.md"
    - "vendor/pocketjs/apps/**/*"
    - "vendor/pocketjs/assets/brand/**/*"
    - "vendor/pocketjs/assets/images/**/*"
    - "vendor/pocketjs/assets/screenshots/**/*"
    - "vendor/pocketjs/docs/**/*"
    - "vendor/pocketjs/engine/Cargo.toml"
    - "vendor/pocketjs/engine/crates/**/*"
    - "vendor/pocketjs/engine/pocket3d/**/*"
    - "vendor/pocketjs/engine/symbian/**/*"
    - "vendor/pocketjs/engine/wasm/**/*"
    - "vendor/pocketjs/hosts/**/*"
    - "vendor/pocketjs/pocket.config.ts"
    - "vendor/pocketjs/pocket.json"
    - "vendor/pocketjs/site/**/*"
    - "vendor/pocketjs/skills/**/*"
    - "vendor/pocketjs/tests/**/*"
    - "vendor/pocketjs/vapor/**/*"
