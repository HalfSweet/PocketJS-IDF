name: Publish component

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated semver tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    publish-${{ github.event_name == 'workflow_dispatch' &&
    inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify the release tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            inputs.tag || github.ref }}

      - name: Validate annotated semver tag on main
        id: tag
        shell: bash
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "release tag is not v-prefixed SemVer: $tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
            echo "release tag must be annotated: $tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "checkout does not match release tag: $tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main; then
            echo "release tag is not in main history: $tag" >&2
            exit 1
          fi
          without_build="${tag%%+*}"
          prerelease=false
          if [[ "$without_build" == *-* ]]; then
            prerelease=true
            prerelease_part="${without_build#*-}"
            IFS=. read -r -a prerelease_identifiers \
              <<<"$prerelease_part"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ &&
                "${#identifier}" -gt 1 &&
                "$identifier" == 0* ]]; then
                echo \
                  "numeric prerelease identifiers cannot have leading zeroes" \
                  >&2
                exit 1
              fi
            done
          fi
          {
            echo "commit=$tag_commit"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

  checks:
    name: Run the complete CI gate
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.verify-tag.outputs.tag }}
      package_version: git

  draft-release:
    name: Prepare the draft GitHub Release
    needs:
      - verify-tag
      - checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.verify-tag.outputs.tag }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: --current --strip header
          config: cliff.toml
          version: v2.13.1
        env:
          OUTPUT: release-notes.md

      - name: Create or update the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          release_args=(
            --title "$RELEASE_TAG"
            --notes-file release-notes.md
          )
          if [[ "$IS_PRERELEASE" == true ]]; then
            release_args+=(--prerelease)
          fi
          if state="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null
          )"; then
            if [[ "$state" == true ]]; then
              gh release edit "$RELEASE_TAG" "${release_args[@]}"
            else
              echo "public release already exists; leaving it public"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              "${release_args[@]}"
          fi

  publish-registry:
    name: Publish to ESP Component Registry
    needs:
      - verify-tag
      - draft-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.verify-tag.outputs.tag }}
          submodules: recursive

      - name: Upload with GitHub OIDC
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          commit_sha: ${{ needs.verify-tag.outputs.commit }}
          components: "pocketjs-idf: ."
          namespace: halfsweet
          # v2.2.1 mishandles bytes while resolving `version: git`.
          # The validated annotated tag remains the only version source.
          version: ${{ needs.verify-tag.outputs.tag }}

  publish-release:
    name: Publish the GitHub Release
    needs:
      - verify-tag
      - publish-registry
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the prepared release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          release_args=(
            release
            edit
            "$RELEASE_TAG"
            --draft=false
          )
          if [[ "$IS_PRERELEASE" == true ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
