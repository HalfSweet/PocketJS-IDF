name: Publish component

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated semver tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag and quality gates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive

      - name: Validate annotated semver tag on main
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$tag" =~ $semver ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          tag_commit="$(git rev-list -n 1 "$tag")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags \
            origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" origin/main
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Verify the pinned PocketJS submodule
        run: >-
          test "$(git -C vendor/pocketjs rev-parse HEAD)"
          = a4e154789655cafa9dc0f57a8c83fc2114d74776

      - name: Cache Rust and Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.bun/install/cache
            rust/target
            vendor/pocketjs/node_modules
          key: release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'vendor/pocketjs/engine/core/Cargo.lock', 'vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.lock', 'vendor/pocketjs/bun.lock') }}

      - name: Install pinned Rust and Bun toolchains
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup component add rustfmt

      - name: Install pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install compiler and Component Manager dependencies
        run: |
          bun install --cwd vendor/pocketjs --frozen-lockfile
          python -m pip install \
            --disable-pip-version-check \
            idf-component-manager==3.0.3

      - name: Re-run source and package tests
        run: |
          cargo fmt \
            --manifest-path rust/Cargo.toml \
            --package pocketjs-esp32-core \
            -- --check
          cargo test --manifest-path rust/Cargo.toml --workspace --locked
          cargo test \
            --manifest-path vendor/pocketjs/engine/core/Cargo.toml \
            --features std \
            --locked
          cargo test \
            --manifest-path vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.toml \
            --features std \
            --locked
          cargo check \
            --manifest-path vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.toml \
            --features esp-idf \
            --locked
          bun test tests/pocket_package.test.ts
          python -m unittest discover -s tests -p 'test_*.py'
          tools/check_determinism.sh

      - name: Pack the tagged component
        run: |
          pack_dir="$RUNNER_TEMP/pocketjs-component-pack"
          mkdir -p "$pack_dir"
          compote -W component pack \
            --name pocketjs-idf \
            --version "${{ steps.version.outputs.version }}" \
            --dest-dir "$pack_dir"
          test -s \
            "$pack_dir/pocketjs-idf_${{ steps.version.outputs.version }}.tgz"

  archive-consumer:
    name: Build the tagged archive consumer
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}
          submodules: recursive

      - name: Cache CI toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/cargo
            .ci/rustup
            .ci/ccache
          key: release-idf-v6.0.2-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build from the unpacked archive
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci/ccache
          command: >-
            bash tools/ci_idf_build.sh archive
            ${{ needs.verify-tag.outputs.version }}

  publish:
    name: Publish to ESP Component Registry
    needs:
      - verify-tag
      - archive-consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}
          submodules: recursive

      - name: Upload with the Registry API token
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: halfsweet
          components: "pocketjs-idf: ."
          version: ${{ needs.verify-tag.outputs.version }}
          api_token: ${{ secrets.IDF_COMPONENTS_TOKEN }}
