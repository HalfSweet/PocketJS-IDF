name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref whose source tree should be checked
        required: false
        type: string
        default: ""
      package_version:
        description: Version used when packing the component
        required: false
        type: string
        default: "0.0.0"

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - name: Verify the checked-out PocketJS gitlink
        shell: bash
        run: |
          expected="$(git rev-parse HEAD:vendor/pocketjs)"
          actual="$(git -C vendor/pocketjs rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: lint-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 \
            --profile minimal \
            --component clippy,rustfmt
          rustup default 1.89.0
          rustup target add \
            --toolchain 1.89.0 \
            riscv32imafc-unknown-none-elf

      - name: Install C formatter and Component Manager
        run: |
          python -m pip install \
            --disable-pip-version-check \
            clang-format==21.1.5 \
            idf-component-manager==3.1.0

      - name: Check C formatting
        shell: bash
        run: |
          mapfile -d '' c_files < <(
            git ls-files -z -- src include private_include examples |
              while IFS= read -r -d '' file; do
                case "$file" in
                  *.c|*.h) printf '%s\0' "$file" ;;
                esac
              done
          )
          test "${#c_files[@]}" -gt 0
          clang-format --dry-run --Werror "${c_files[@]}"

      - name: Check Rust formatting
        run: >-
          cargo fmt
          --manifest-path rust/Cargo.toml
          --package pocketjs-esp32-core
          -- --check

      - name: Clippy host tests
        run: >-
          cargo clippy
          --manifest-path rust/Cargo.toml
          --workspace
          --tests
          --locked
          -- -D warnings

      - name: Clippy RISC-V release target
        run: >-
          cargo clippy
          --manifest-path rust/Cargo.toml
          --target riscv32imafc-unknown-none-elf
          --release
          --lib
          --locked
          -- -D warnings

      - name: Lint component manifests
        run: >-
          compote manifest lint
          idf_component.yml
          examples/prebuilt/main/idf_component.yml
          examples/source/main/idf_component.yml

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: "yes"
          scandir: "./tools"
          version: v0.11.0

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          pyflakes: "false"
          shellcheck: "false"
          version: 1.7.12

  quality:
    name: Rust, packages, and component archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out the component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - name: Verify the checked-out PocketJS gitlink
        shell: bash
        run: |
          expected="$(git rev-parse HEAD:vendor/pocketjs)"
          actual="$(git -C vendor/pocketjs rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Cache Rust and Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.bun/install/cache
            rust/target
            vendor/pocketjs/node_modules
          key: quality-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'vendor/pocketjs/engine/core/Cargo.lock', 'vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.lock', 'vendor/pocketjs/bun.lock') }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - name: Install pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install PocketJS compiler dependencies
        run: bun install --cwd vendor/pocketjs --frozen-lockfile

      - name: Test the Rust integration and upstream crates
        run: |
          cargo test \
            --manifest-path rust/Cargo.toml \
            --workspace \
            --locked
          cargo test \
            --manifest-path vendor/pocketjs/engine/core/Cargo.toml \
            --features std \
            --locked
          cargo test \
            --manifest-path vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.toml \
            --features std \
            --locked
          cargo check \
            --manifest-path vendor/pocketjs/engine/backends/esp32p4-ppa/Cargo.toml \
            --features esp-idf \
            --locked

      - name: Test the Pocket encoder and archive audit
        run: |
          bun test tests/pocket_package.test.ts
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify deterministic Pocket compilation
        run: tools/check_determinism.sh

      - name: Install Component Manager
        run: >-
          python -m pip install
          --disable-pip-version-check
          idf-component-manager==3.1.0

      - name: Pack and audit the component
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0' }}
        run: |
          pack_dir="$RUNNER_TEMP/pocketjs-component-pack"
          mkdir -p "$pack_dir"
          compote -W component pack \
            --name pocketjs-idf \
            --version "$PACKAGE_VERSION" \
            --dest-dir "$pack_dir"
          mapfile -t archives < <(
            find "$pack_dir" -maxdepth 1 -type f \
              -name 'pocketjs-idf_*.tgz' -print
          )
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo \
              "expected exactly one component archive, found ${#archives[@]}" \
              >&2
            exit 1
          fi
          python tools/audit_component_archive.py "${archives[0]}"

  idf:
    name: ESP-IDF ${{ matrix.idf }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf: v5.4.4
            mode: prebuilt
          - idf: v6.0.2
            mode: prebuilt
          - idf: v6.0.2
            mode: source
          - idf: v6.0.2
            mode: archive
    steps:
      - name: Check out the component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Component Manager derives an override component's CMake name from
          # its directory. GitHub otherwise checks out this repository as
          # "PocketJS-IDF", which does not match halfsweet/pocketjs-idf on
          # case-sensitive Linux runners.
          path: pocketjs-idf
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - name: Cache CI toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pocketjs-idf/.ci/cargo
            pocketjs-idf/.ci/rustup
            pocketjs-idf/.ci/bun
            pocketjs-idf/.ci/ccache
            pocketjs-idf/vendor/pocketjs/node_modules
          key: idf-${{ matrix.idf }}-${{ matrix.mode }}-${{ hashFiles('pocketjs-idf/rust/Cargo.lock', 'pocketjs-idf/vendor/pocketjs/bun.lock') }}

      - name: Build the consumer
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32p4
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/pocketjs-idf/.ci/ccache
          command: >-
            cd pocketjs-idf &&
            bash tools/ci_idf_build.sh
            ${{ matrix.mode }}
            ${{ inputs.package_version || '0.0.0' }}
